# Standalone project — PDF -> DOCX conversion (Decree 30/2020/NĐ-CP).
# Fully independent: own image names, own volumes, own .env. Nothing here
# touches the master stack or repo.
#
#   docker compose up -d --build
#   (backend: http://localhost:3001  conversion: http://localhost:8004)
#
# Conversion flow: frontend (/api/proxy) -> backend POST /api/convert ->
# Redis conversion_queue -> conversion-worker -> DOCX result.
# Postgres + Redis are required; docling/embeddings/renderer are NOT part of
# this project (the /api/convert path never touches them).
services:
  postgres:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_docs}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD env is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-ai_docs}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  conversion:
    build:
      context: .
      dockerfile: conversion-service/Dockerfile
    image: standalone/conversion:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8004:8004"
    environment:
      REDIS_URL: redis://redis:6379
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CONVERSION_WORK_DIR: /app/work
    volumes:
      - conversion_work:/app/work
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8004/ready', timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 3

  conversion-worker:
    build:
      context: .
      dockerfile: conversion-service/Dockerfile
    image: standalone/conversion:latest
    restart: unless-stopped
    command: ["python", "worker.py"]
    environment:
      REDIS_URL: redis://redis:6379
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CONVERSION_WORK_DIR: /app/work
    volumes:
      - conversion_work:/app/work
    depends_on:
      redis:
        condition: service_healthy
      conversion:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: standalone/backend:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${DB_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:-ai_docs}?schema=public
      REDIS_URL: redis://redis:6379
      CONVERSION_SERVICE_URL: http://conversion:8004
      TEMPLATE_STORAGE_DIR: /data/templates
      UPLOAD_DIR: /data/uploads
      RAG_STATE_DIR: /data/rag-state
      ALLOW_STACK_TRACES: ${ALLOW_STACK_TRACES:-false}
      NODE_ENV: ${NODE_ENV:-development}
    volumes:
      - template_storage:/data/templates
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      # /health returns 200 or 503 (degraded). 503 is EXPECTED here because
      # docling/embeddings/renderer are absent — the convert path never uses
      # them. Treat 200/503 as "backend alive".
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/health | grep -Eq '200|503'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  storage-init:
    image: alpine:3.22
    restart: "no"
    user: "0:0"
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /data/templates /data/uploads /data/rag-state
        chown -R 1000:1000 /data/templates /data/uploads /data/rag-state
    volumes:
      - template_storage:/data/templates
      - uploads_data:/data/uploads
    network_mode: none
    read_only: true

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME:-standalone_postgres_data}
  redis_data:
    name: ${REDIS_VOLUME:-standalone_redis_data}
  template_storage:
  uploads_data:
  conversion_work:
