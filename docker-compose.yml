# Standalone project — PDF -> DOCX conversion (Decree 30/2020/NĐ-CP).
# Fully independent: own image names, own volumes, own .env. Nothing here
# touches the master stack or repo.
#
#   docker compose up -d --build
#   (frontend: http://localhost:3000  backend: http://localhost:3001
#    conversion: http://localhost:8004)
#
# Conversion flow: frontend (/api/proxy) -> backend POST /api/convert ->
# Redis conversion_queue -> conversion-worker -> DOCX result.
# Postgres + Redis are required; docling/embeddings/renderer are NOT part of
# this project (the /api/convert path never touches them).
services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_docs}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD env is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-ai_docs}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  conversion:
    build:
      context: .
      dockerfile: conversion-service/Dockerfile
    image: standalone/conversion:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CONVERSION_PORT:-8004}:8004"
    environment:
      REDIS_URL: redis://redis:6379
      CONVERSION_WORK_DIR: /app/work
      CONVERSION_MAX_QUEUE_DEPTH: ${CONVERSION_MAX_QUEUE_DEPTH:-100}
      QUOTA_DAILY_LIMIT: ${QUOTA_DAILY_LIMIT:-50}
    volumes:
      - conversion_work:/app/work
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8004/ready', timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 3

  conversion-worker:
    build:
      context: .
      dockerfile: conversion-service/Dockerfile
    image: standalone/conversion:latest
    restart: unless-stopped
    command: ["python", "worker.py"]
    # The worker runs no HTTP server — disable the image-level /health probe.
    healthcheck:
      disable: true
    environment:
      REDIS_URL: redis://redis:6379
      CONVERSION_WORK_DIR: /app/work
      CONVERSION_MAX_QUEUE_DEPTH: ${CONVERSION_MAX_QUEUE_DEPTH:-100}
    volumes:
      - conversion_work:/app/work
    depends_on:
      redis:
        condition: service_healthy
      conversion:
        condition: service_healthy

  # One-shot: apply the single auth-only Prisma migration (ADR-0001) to a fresh
  # database before the backend boots. The backend image CMD stays
  # "node dist/index.js" (no DB mutations at container start — enforced by
  # backend/src/index.worker_wiring.test.ts).
  migrate:
    image: standalone/backend:latest
    restart: "no"
    # node_modules/.bin is added to PATH because the runtime image strips npm/npx.
    command:
      - sh
      - -ec
      - >
        export PATH="/app/node_modules/.bin:$$PATH";
        baseline_state="$$(node dist/scripts/detect_migration_baseline.js)";
        if [ "$$baseline_state" = "compatible" ]; then
          prisma migrate resolve --applied 20260901000000_init_standalone_auth;
        fi;
        prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${DB_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:-ai_docs}?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: standalone/backend:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3001}:3001"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${DB_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:-ai_docs}?schema=public
      REDIS_URL: redis://redis:6379
      CONVERSION_SERVICE_URL: http://conversion:8004
      UPLOAD_DIR: /data/uploads
      ALLOW_STACK_TRACES: ${ALLOW_STACK_TRACES:-false}
      NODE_ENV: ${NODE_ENV:-development}
      PASSWORD_RESET_MODE: ${PASSWORD_RESET_MODE:-disabled}
      DISABLE_PUBLIC_REGISTER: ${DISABLE_PUBLIC_REGISTER:-false}
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # /health returns 200 or 503 (degraded). 503 is EXPECTED here because
      # docling/embeddings/renderer are absent — the convert path never uses
      # them. Treat 200/503 as "backend alive". node:22-alpine ships no curl,
      # so probe with the runtime's own Node (global fetch).
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health',{signal:AbortSignal.timeout(5000)}).then(r=>process.exit(r.status===200||r.status===503?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Next.js production build (standalone output) proxying /api/* to the backend.
  # BACKEND_API_URL is consumed at RUNTIME by the server-side proxy route, so it
  # is injected here (not baked at image build). One `docker compose up` runs the
  # whole product: database, queue, conversion, worker, backend, frontend.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: standalone/frontend:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    environment:
      # Bind the standalone Next.js server to all interfaces inside the container.
      HOSTNAME: 0.0.0.0
      PORT: 3000
      # Server-side proxy target (frontend/app/api/proxy/[...path]/route.ts).
      BACKEND_API_URL: http://backend:3001
      PASSWORD_RESET_MODE: ${PASSWORD_RESET_MODE:-disabled}
      # This standalone stack serves local HTTP. Set true only behind HTTPS.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      FRONTEND_TRUST_PROXY_HOPS: ${FRONTEND_TRUST_PROXY_HOPS:-0}
      DISABLE_PUBLIC_REGISTER: ${DISABLE_PUBLIC_REGISTER:-false}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # /api/live is a self-contained liveness probe (does not cascade to the
      # backend). node:22-alpine ships no curl, so probe with Node's fetch.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/live',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  storage-init:
    image: alpine:3.22
    restart: "no"
    user: "0:0"
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /data/uploads
        chown -R 1000:1000 /data/uploads
    volumes:
      - uploads_data:/data/uploads
    network_mode: none
    read_only: true

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME:-standalone_postgres_data}
  redis_data:
    name: ${REDIS_VOLUME:-standalone_redis_data}
  uploads_data:
  conversion_work:
