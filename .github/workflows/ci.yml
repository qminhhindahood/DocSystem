name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare-worker/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=moderate

  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://docai:contract-only@127.0.0.1:5432/docai
      REDIS_URL: redis://127.0.0.1:6379
      DOCLING_URL: http://127.0.0.1:8001
      EMBEDDINGS_URL: http://127.0.0.1:8002
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npx prisma validate
      - run: npm run check-schema
      - run: npm run test:migrations
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=moderate

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run --maxWorkers=4
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=moderate

  renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test document-renderer/DocumentRenderer.sln
      - run: dotnet build document-renderer/DocumentRenderer.sln -c Release --no-restore

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: '${{ matrix.service }}'
    strategy:
      fail-fast: false
      matrix:
        service: [docling-service, embeddings-service]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: '${{ matrix.service }}/requirements*.txt'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q
      - run: python -m compileall -q main.py

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.15.8'
      - run: terraform -chdir=infra/terraform fmt -recursive -check
      - run: terraform -chdir=infra/terraform init -backend=false -input=false
      - run: terraform -chdir=infra/terraform validate

  containers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: backend
          - service: frontend
            context: frontend
          - service: docling
            context: docling-service
          - service: embeddings
            context: deploy/embeddings-jina-proxy
          - service: renderer
            context: document-renderer
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: '${{ matrix.context }}'
          load: true
          push: false
          tags: 'local/docai-${{ matrix.service }}:${{ github.sha }}'
      - name: Release Docling build cache before image scan
        if: matrix.service == 'docling'
        run: docker buildx prune --all --force
      # SHA-pinned after the March 2026 Trivy supply-chain incident.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: 'local/docai-${{ matrix.service }}:${{ github.sha }}'
          format: table
          scanners: vuln
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: 'false'
          exit-code: '1'

  repository-contracts:
    runs-on: ubuntu-latest
    needs: [backend, frontend, renderer, python, terraform]
    steps:
      - uses: actions/checkout@v7
      - name: Prepare safe Compose contract environment
        run: cp backend/.env.example backend/.env
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.15.8'
      - name: Install operations test runner
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force
      - name: Canonical repository and operations contracts
        shell: pwsh
        run: ./ops/verify-all.ps1 -ContractsOnly
