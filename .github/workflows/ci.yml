name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://docai:contract-only@127.0.0.1:5432/docai
      REDIS_URL: redis://127.0.0.1:6379
      CONVERSION_SERVICE_URL: http://127.0.0.1:8004
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npx prisma validate
      - run: npm run check-schema
      - run: npm run test:migrations
      - run: npm run build
      - name: Audit backend production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit backend development dependencies
        run: npm audit --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run --maxWorkers=4
      - run: npm run lint
      - run: npm run build
      - name: Build Cloudflare worker (OpenNext adapter, ticket 07)
        run: npx opennextjs-cloudflare build
      - name: Audit frontend production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit frontend development dependencies
        run: npm audit --audit-level=high

  conversion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: conversion-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 'conversion-service/requirements*.txt'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests -q
      - run: python -m compileall -q .
      - name: Verify typography sync
        run: python scripts/check_typography_sync.py
      - name: Run release render preflight
        run: python eval/verify_p0a.py

  containers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: backend
          - service: conversion
            context: .
            dockerfile: conversion-service/Dockerfile
          - service: frontend
            context: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: '${{ matrix.context }}'
          file: '${{ matrix.dockerfile || format(''{0}/Dockerfile'', matrix.context) }}'
          load: true
          push: false
          tags: 'local/docai-${{ matrix.service }}:${{ github.sha }}'
      # SHA-pinned after the March 2026 Trivy supply-chain incident.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: 'local/docai-${{ matrix.service }}:${{ github.sha }}'
          format: table
          scanners: vuln
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: 'false'
          exit-code: '1'
      # Container contract: the conversion image must not ship work files,
      # the virtualenv, caches, or other non-runtime content.
      - name: Conversion image content contract
        if: matrix.service == 'conversion'
        shell: pwsh
        run: ./ops/test-conversion-image.ps1 -Image 'local/docai-conversion:${{ github.sha }}'

  repository-contracts:
    runs-on: ubuntu-latest
    needs: [backend, frontend, conversion]
    steps:
      - uses: actions/checkout@v7
      - name: Prepare safe Compose contract environment
        run: cp backend/.env.example backend/.env
      - name: Install operations test runner
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force
      - name: Canonical repository and operations contracts
        shell: pwsh
        run: ./ops/verify-all.ps1 -ContractsOnly
