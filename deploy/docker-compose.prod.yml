# Production deployment for the AI Document System.
# Only nginx publishes host ports. Embeddings use the Jina Cloud proxy.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/letsencrypt:/etc/letsencrypt:ro
      - ./nginx/acme:/var/www/certbot:ro
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:size=1m,mode=0755
      - /var/cache/nginx:size=16m,mode=0755
      - /var/run:size=1m,mode=0755
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          pids: 100
    logging: *default-logging
    networks:
      - edge
      - backend_net
      - frontend_net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_API_URL: http://backend:3001
      NODE_ENV: production
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:?TURNSTILE_SITE_KEY is required}
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G
          pids: 200
    logging: *default-logging
    networks:
      - frontend_net

  storage-init:
    image: alpine:3.22
    restart: "no"
    user: "0:0"
    command:
      - /bin/sh
      - -ec
      - |
        chown 1000:1654 /data/templates
        chmod 0770 /data/templates
        chown 1000:1000 /data/uploads
        chmod 0700 /data/uploads
        chown 1000:1000 /data/rag-state
        chmod 0700 /data/rag-state
    volumes:
      - template_storage:/data/templates
      - uploads_data:/data/uploads
      - rag_state:/data/rag-state
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
    deploy:
      resources:
        limits:
          pids: 20
    logging: *default-logging

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    user: "1000:1000"
    environment:
      DATABASE_URL: ${DB_URL:?DB_URL is required (PostgreSQL with permission to use pgvector)}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DOCLING_URL: http://docling:8001
      DOCLING_TIMEOUT_MS: ${DOCLING_TIMEOUT_MS:-300000}
      DOCLING_OCR_TIMEOUT_MS: ${DOCLING_OCR_TIMEOUT_MS:-1800000}
      EMBEDDINGS_URL: http://embeddings:8002
      DOCUMENT_RENDERER_URL: http://document-renderer:8080
      RENDERER_INTERNAL_TOKEN: ${RENDERER_INTERNAL_TOKEN:?RENDERER_INTERNAL_TOKEN is required}
      TEMPLATE_STORAGE_DIR: /data/templates
      UPLOAD_DIR: /data/uploads
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      LLM_CONFIG_ENCRYPTION_KEY: ${LLM_CONFIG_ENCRYPTION_KEY:?LLM_CONFIG_ENCRYPTION_KEY is required}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      TRUST_PROXY_HOPS: "1"
      NODE_ENV: production
      ALLOW_STACK_TRACES: "false"
      DISABLE_PUBLIC_REGISTER: "false"
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?TURNSTILE_SECRET_KEY is required}
      TURNSTILE_EXPECTED_HOSTNAMES: ${DOMAIN:?DOMAIN is required}
      LOCAL_LLM_HOST_ALLOWLIST: ${LOCAL_LLM_HOST_ALLOWLIST:-}
      OPENROUTER_RECOMMENDED_MODELS: ${OPENROUTER_RECOMMENDED_MODELS:-openrouter/free}
      REINDEX_MANIFEST_PATH: /data/rag-state/reindex-manifest.json
      RAG_RESULTS_DIR: /data/rag-state/reports
    volumes:
      - template_storage:/data/templates
      - uploads_data:/data/uploads
      - rag_state:/data/rag-state
    depends_on:
      storage-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      docling:
        condition: service_healthy
      embeddings:
        condition: service_healthy
      document-renderer:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777,uid=1000,gid=1000
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          pids: 300
    logging: *default-logging
    networks:
      - backend_net
      - renderer_internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    user: redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          pids: 100
    logging: *default-logging
    networks:
      - backend_net

  docling:
    build:
      context: ../docling-service
      dockerfile: Dockerfile
    restart: unless-stopped
    user: "65532:65532"
    environment:
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777,uid=65532,gid=65532
      - /app/uploads:size=256m,mode=0700,uid=65532,gid=65532
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8001/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 4G
          pids: 300
    logging: *default-logging
    networks:
      - backend_net

  embeddings:
    build:
      context: ./embeddings-jina-proxy
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      JINA_API_KEY: ${JINA_API_KEY:?JINA_API_KEY is required}
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,uid=10001,gid=10001
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8002/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          pids: 100
    logging: *default-logging
    networks:
      - backend_net

  document-renderer:
    build:
      context: ../document-renderer
      dockerfile: Dockerfile
    restart: unless-stopped
    user: "1654:1654"
    expose:
      - "8080"
    environment:
      RENDERER_SERVICE_TOKEN: ${RENDERER_INTERNAL_TOKEN:?RENDERER_INTERNAL_TOKEN is required}
      RENDERER_STORAGE_ROOT: /data/templates
      RENDERER_TEMP_ROOT: /tmp/document-renderer
      RENDERER_REQUIRED_FONTS: ${RENDERER_REQUIRED_FONTS:-Liberation Serif,Liberation Sans,Carlito,Caladea,Noto Sans}
      RENDERER_RENDER_TIMEOUT_SECONDS: ${RENDERER_RENDER_TIMEOUT_SECONDS:-120}
      RENDERER_MAX_CONCURRENT_RENDERS: ${RENDERER_MAX_CONCURRENT_RENDERS:-2}
      RENDERER_PNG_DPI: ${RENDERER_PNG_DPI:-144}
      RENDERER_MAX_RENDERED_PAGES: ${RENDERER_MAX_RENDERED_PAGES:-100}
      RENDERER_MAX_RENDERED_BYTES: ${RENDERER_MAX_RENDERED_BYTES:-268435456}
      HOME: /tmp/document-renderer/home
      XDG_CACHE_HOME: /tmp/document-renderer/.cache
      SAL_USE_VCLPLUGIN: svp
      SAL_DISABLE_COMPONENTKIT: "1"
    volumes:
      - template_storage:/data/templates
    depends_on:
      storage-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp/document-renderer:size=512m,mode=1770,uid=1654,gid=1654
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 3G
          pids: 300
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *default-logging
    networks:
      - renderer_internal

volumes:
  redis_data:
  template_storage:
  uploads_data:
  rag_state:

networks:
  edge: {}
  frontend_net:
    internal: true
  backend_net: {}
  renderer_internal:
    internal: true
